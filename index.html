
<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PORTAL JSS IPGKT | CHECKPOINT 2.0</title>
    
    <!-- Penting untuk Google Sites supaya pautan berfungsi dari dalam iframe -->
    <base target="_blank">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --jss-bg: #001a33;
        --jss-red: #EE2A24;
        --jss-blue: #003366;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--jss-bg);
        color: #fff;
        font-family: 'Space Grotesk', sans-serif;
        overflow-x: hidden;
        /* Mengelakkan jitter pada sesetengah browser */
        -webkit-font-smoothing: antialiased;
      }

      /* Splash Screen */
      #loader-wrapper {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: var(--jss-bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }

      .loader-logo {
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
        filter: drop-shadow(0 0 15px rgba(238, 42, 36, 0.3));
        animation: breath 3s infinite ease-in-out;
      }

      .loader-bar-container {
        width: 200px;
        height: 2px;
        background: rgba(255,255,255,0.05);
        position: relative;
        overflow: hidden;
        border-radius: 10px;
      }

      .loader-progress {
        position: absolute;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--jss-red), transparent);
        animation: slide 1.5s infinite linear;
      }

      @keyframes breath {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      /* Class yang ditambah oleh JavaScript apabila React siap */
      .app-ready #loader-wrapper {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Styling tajuk font-heading */
      h1, h2, h3, .font-heading {
        font-family: 'Syncopate', sans-serif;
      }

      /* Custom scrollbar untuk Google Sites */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--jss-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--jss-red);
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
        "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
      }
    }
    </script>
  </head>
  <body>
    <!-- Splash Screen / Loader -->
    <div id="loader-wrapper">
      <img src="https://github.com/ahmadiabw/portal-jss/blob/main/aset/logo%20IPGKT.png?raw=true" alt="JSS Logo" class="loader-logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/8/87/Logo_IPGM.png'"/>
      <div class="loader-bar-container">
        <div class="loader-progress"></div>
      </div>
      <p style="margin-top: 20px; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.4; font-weight: 700;">Jabatan Sains Sosial</p>
    </div>

    <!-- React App Mount Point -->
    <div id="root"></div>

    <!-- Load the main entry point -->
    <script type="module" src="index.tsx"></script>

    <script>
      /**
       * Mencegah "Flicker" dan memastikan transisi smooth.
       * Kita menunggu sehingga window.load atau React mount event.
       */
      window.addEventListener('DOMContentLoaded', () => {
        // Beri sedikit masa extra untuk React "settle"
        setTimeout(() => {
          document.body.classList.add('app-ready');
        }, 1200);
      });
    </script>
  </body>
</html>
